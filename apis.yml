aid: cents
name: Cents
description: 'Cents is an all-in-one laundry business management platform for laundromats
  and dry cleaners. It combines point of sale, self-service machine payment systems,
  wash-and-fold order management, online ordering, pickup-and-delivery route management,
  memberships and recurring billing, inventory tracking, team management, marketing
  tools, customer-facing websites, commercial invoicing, and reporting and financial
  tools into a single operating system for local laundry businesses. Cents also offers
  an AI Receptionist team and laundry-first insurance, and has acquired Insight Systems
  and Laundroworks to extend support for dry cleaners and card-based self-service payment
  technology.'
